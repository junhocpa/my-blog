<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · {{siteTitle}}</title>
  <meta name="description" content="{{description}}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* localStorage 접근 불가 시 CSS 미디어 쿼리 폴백 */ }
    })();
  </script>
  <link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="{{root}}index.html">{{siteTitle}}</a>
      <button class="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">🌙</button>
    </div>
  </header>

  <main class="container">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{title}}</h1>
        <p class="post-meta">
          <time datetime="{{date}}">{{dateFormatted}}</time>
          {{tagChips}}
        </p>
      </header>
      <div class="post-content">
{{content}}
      </div>
    </article>

    <nav class="post-nav" aria-label="이전/다음 글">{{prevNext}}</nav>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{year}} {{siteTitle}}</p>
    </div>
  </footer>

  <script src="{{root}}assets/main.js"></script>
</body>
</html>
