<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{siteTitle}}</title>
  <meta name="description" content="{{siteDescription}}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* localStorage 접근 불가 시 CSS 미디어 쿼리 폴백 */ }
    })();
  </script>
  <link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="{{root}}index.html">{{siteTitle}}</a>
      <button class="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">🌙</button>
    </div>
  </header>

  <main class="container">
    <section class="app-section" aria-labelledby="app-heading">
      <h2 id="app-heading" class="section-heading">웹앱</h2>
      <ul class="app-list">
        <li class="app-card">
          <a class="app-link" href="{{root}}apps/2048/index.html">
            <span class="app-preview" aria-hidden="true">
              <iframe src="{{root}}apps/2048/index.html" title="2048 게임 미리보기" loading="lazy" tabindex="-1" scrolling="no"></iframe>
            </span>
            <span class="app-info">
              <span class="app-card-title">2048</span>
              <span class="app-card-desc">방향키·스와이프로 숫자 타일을 밀어 합치는 퍼즐 게임. 점수판과 최고 기록 저장.</span>
            </span>
          </a>
        </li>
      </ul>
    </section>

    <section aria-labelledby="posts-heading">
      <h2 id="posts-heading" class="section-heading">글</h2>
      <nav class="tag-filter" aria-label="태그 필터">{{tagList}}</nav>
      <ul class="post-list">{{postList}}</ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{year}} {{siteTitle}}</p>
    </div>
  </footer>

  <script src="{{root}}assets/main.js"></script>
</body>
</html>
